<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Primary SEO -->
    <title>Blueline Auto Services Ltd | Vehicle Sales, Hire, Servicing & Recovery — UK</title>
    <meta name="description" content="Blueline Auto Services Ltd offers professional automotive services in the UK, including vehicle sales, hire, servicing, repairs, recovery, valeting, and vehicle sourcing." />
    <meta name="keywords" content="automotive services UK, vehicle sales, vehicle hire, car servicing, vehicle recovery, valeting, Blueline Auto Services" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.bluelineauto.co.uk/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Blueline Auto Services Ltd" />
    <meta property="og:title"       content="Blueline Auto Services Ltd | Your Trusted Automotive Partner" />
    <meta property="og:description" content="Professional automotive services in the UK — vehicle sales, hire, servicing, repairs, recovery, valeting and more, all under one roof." />
    <meta property="og:url"         content="https://www.bluelineauto.co.uk/" />
    <meta property="og:image"       content="/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Blueline Auto Services Ltd" />
    <meta name="twitter:description" content="Professional automotive services in the UK — all under one roof." />
    <meta name="twitter:image"       content="/logo.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <style>
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #1d6feb;
        color: white;
        padding: 8px 16px;
        font-weight: 600;
        z-index: 9999;
        font-family: Inter, sans-serif;
        font-size: 14px;
        text-decoration: none;
        border-radius: 0 0 6px 0;
        transition: top 0.2s ease;
      }
      .skip-link:focus {
        top: 0;
      }
      /* Prevent flash of unstyled content */
      body { margin: 0; background: #fff; }
    </style>
  </body>
</html>
